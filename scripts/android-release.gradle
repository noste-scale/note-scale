// ponytail: inject signing at build time; Expo can regenerate android/ unchanged.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            project.androidComponents.finalizeDsl { android ->
                // ponytail: short per-checkout cache avoids Ninja's Windows 260-character ceiling.
                def checkoutHash = Integer.toHexString(project.rootDir.absolutePath.hashCode())
                android.externalNativeBuild.cmake.buildStagingDirectory = new File(project.gradle.gradleUserHomeDir, "cxx/${checkoutHash}")
                def signingPropertiesFile = new File(project.rootDir, '../../../signing/android/release.properties').canonicalFile
                if (!signingPropertiesFile.isFile()) {
                    throw new GradleException('Missing signing/android/release.properties. Restore the original signing backup; do not generate another key.')
                }
                def signingProperties = new Properties()
                signingPropertiesFile.withInputStream { inputStream -> signingProperties.load(inputStream) }
                ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
                    if (!signingProperties.getProperty(name)?.trim()) {
                        throw new GradleException("Missing signing property: ${name}")
                    }
                }
                def keystore = new File(signingPropertiesFile.parentFile, signingProperties.getProperty('storeFile')).canonicalFile
                if (!keystore.isFile()) {
                    throw new GradleException('Release keystore missing. Restore the original signing backup.')
                }
                def releaseSigningConfig = android.signingConfigs.maybeCreate('notescaleRelease')
                releaseSigningConfig.storeFile = keystore
                releaseSigningConfig.storePassword = signingProperties.getProperty('storePassword')
                releaseSigningConfig.keyAlias = signingProperties.getProperty('keyAlias')
                releaseSigningConfig.keyPassword = signingProperties.getProperty('keyPassword')
                android.buildTypes.getByName('release').signingConfig = releaseSigningConfig
            }
        }
    }
}
