name: Test and deploy NoteScale Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify mobile startup
        run: npm run verify:mobile-start
        timeout-minutes: 2
      - run: npm run generate:audio
      - run: npm run verify:audio
      - name: Check deterministic generated audio
        run: git diff --exit-code -- assets/audio apps/web/public/audio apps/mobile/assets/audio
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run export --workspace @notescale/mobile
      - run: npm run build
      - run: npm run verify:web-build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
